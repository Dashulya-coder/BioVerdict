  as_of: 2026-10-10
  document:
    text: >-
      Inhibition of Bruton’s tyrosine kinase (BTK) limited microglial transcriptional changes and
      prevented myelin loss following microglial envelopment.
    url: https://doi.org/10.64898/2026.08.25.747169
    source: Europe PMC preprint (bioRxiv)
    source_kind: preprint
    level: in_vitro
    published_at: 2026-08-28
  expect: { module: mechanism_validation, direction: up }

- id: noise-kras-lung-release
