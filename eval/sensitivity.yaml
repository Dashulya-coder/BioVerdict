# Sensitivity benchmark for BTK inhibitor x multiple sclerosis (docs/eval.md, "Sensitivity
# benchmark"). Every document is a verbatim sentence of a public record that the connectors
# retrieved on 2026-10-10; `item` names it. The base run must not hold them yet, so start it with
# an earlier cutoff, then add them one at a time:
#
#   cd backend
#   USE_FIXTURES=0 uv run --env-file ../.env bioverdict run \
#     --query "BTK inhibitor for multiple sclerosis" --as-of 2024-06-30
#   uv run --env-file ../.env bioverdict sensitivity --run <that run id> \
#     --cases ../eval/sensitivity.yaml --out ../eval/results/<date>
#
# `expect` says which module should move and which way. It is the direction a reader of the
# sentence would expect, not a recorded result: replace it only with a reason.
- id: strong-tolebrutinib-not-superior
  kind: strong
  item: PMID 40202623 (tolebrutinib vs teriflunomide in relapsing MS, 2025)
  as_of: 2026-10-10
  document:
    text: >-
      Tolebrutinib was not superior to teriflunomide in decreasing annualized relapse rates among
      participants with relapsing multiple sclerosis.
    url: https://pubmed.ncbi.nlm.nih.gov/40202623/
    source: PubMed
    source_kind: peer_reviewed
    level: human_interventional
    published_at: 2025-04-09
  expect: { module: clinical_development, direction: down }

- id: strong-evobrutinib-not-superior
  kind: strong
  item: PMID 39307151 (evobrutinib vs teriflunomide in relapsing MS, 2024)
  as_of: 2026-10-10
  document:
    text: The efficacy of evobrutinib was not superior to that of teriflunomide.
    url: https://pubmed.ncbi.nlm.nih.gov/39307151/
    source: PubMed
    source_kind: peer_reviewed
    level: human_interventional
    published_at: 2024-09-22
  expect: { module: clinical_development, direction: down }

- id: strong-fenebrutinib-lesions
  kind: strong
  item: PMID 40683275 (fenebrutinib vs placebo, new T1 Gd+ lesions, 2025)
  as_of: 2026-10-10
  document:
    text: >-
      The combined number of new T1 Gd+ lesions at weeks 4, 8, and 12 were 0·077 (95% CI
      0·043-0·135) in the fenebrutinib group and 0·245 (0·144-0·418) in the placebo group (69%
      relative reduction [95% CI 34-85]; p=0·0022).
    url: https://pubmed.ncbi.nlm.nih.gov/40683275/
    source: PubMed
    source_kind: peer_reviewed
    level: human_interventional
    published_at: 2025-07-19
  # Changed on 2026-10-11 from clinical_development up, after the run of 2026-10-10 placed the
  # document on the translation chain. Fewer new MRI lesions is the "biological response" link of
  # the brief's chain (molecular effect, exposure, target engagement, biological response,
  # patient benefit), not a patient benefit such as fewer relapses. The case was written before a
  # new fact could close a link of the chain (#116). Under the first expectation it fails.
  expect: { module: preclinical_translation, direction: up }

- id: weak-microglia-preprint
