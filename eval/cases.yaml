# Evaluation cases (docs/eval.md, sections 4 and 5). The cases and their expectations are B10 (Dasha).
#   cd backend && uv run bioverdict eval --cases ../eval/cases.yaml --out ../eval/results/<date>
# `set` says what a case is for: demo (the pair shown on stage), backtest (a retrospective case
# whose `outcome` is known and never shown to the model), regression, smoke (the runner runs).
# `probes` are sensitivity tests, run in live mode only: one real document is added to the case's
# first finished run and code judges whether the run moved as much as that kind of document should.
# In fixture mode only assets with a fixture can finish; other cases are reported as failed.
# Every expectation is a reading of the public record by a person, not an expert's answer.
- id: btk-ms-demo
  set: demo
  input:
    indication: multiple sclerosis
    mechanism: BTK inhibitor
  expected_verdict:
  - Conditional
  expected_top_risks:
  - 'No BTK inhibitor is approved for multiple sclerosis: the FDA refused tolebrutinib in non-relapsing
    secondary progressive MS'
  - Drug-induced liver injury is a recognised risk of the class
  - 'Phase 3 results are mixed across the class: evobrutinib and tolebrutinib failed, fenebrutinib and
    remibrutinib beat teriflunomide'
  - Most relapsing-MS trials compare with teriflunomide, not with the higher-efficacy anti-CD20 antibodies
  signals:
  - text: 'Fenebrutinib: FENhance 1 and 2 reduced the annualised relapse rate versus teriflunomide in
      relapsing MS; FENtrepid was noninferior to ocrelizumab in primary progressive MS'
    url: https://www.roche.com/media/releases/med-cor-2026-04-21c
    date: 2026-04-21
  - text: 'Remibrutinib: REMODEL-1 and -2 met the primary endpoint versus teriflunomide; no liver safety
      signal reported by the sponsor'
    url: https://www.novartis.com/news/media-releases/novartis-remibrutinib-high-efficacy-oral-btk-inhibitor-significantly-reduces-relapse-rates-and-shows-favorable-safety-profile-phase-iii-rms-trials
    date: 2026-09-01
  - text: 'Tolebrutinib: PERSEUS in primary progressive MS did not meet its primary endpoint; drug-induced
      liver injury is an identified risk'
    url: https://www.sanofi.com/assets/dotcom/pressreleases/2025/2025-12-15-06-05-00-3205094-en.pdf
    date: 2025-12-15
  - text: 'Tolebrutinib: the FDA issued a complete response letter for non-relapsing secondary progressive
      MS'
    url: https://multiplesclerosisnewstoday.com/news-posts/2025/12/29/fda-denies-tolebrutinib-approval-nonrelapsing-progressive-ms/
    date: 2025-12-29
  - text: 'Evobrutinib: the two phase 3 EVOLUTION trials did not beat teriflunomide on annualised relapse
      rate'
    url: https://www.mssociety.org.uk/research/latest-research/latest-research-news-and-blogs/phase-3-trials-show-evobrutinib-no-better-existing-treatments-people-relapsing-ms
    date: 2023-12-05
  recorded_by: Dasha (the demo pair; a reading of the public record, not an expert's answer)
  recorded_at: 2026-10-10
- id: evobrutinib-2023-11
  set: backtest
  input:
    asset: evobrutinib
  as_of: 2023-11-30
  expected_verdict:
  - Conditional
  - Do Not Invest
  expected_top_risks:
  - 'No phase 3 result yet: the benefit over teriflunomide is not shown'
  - Liver enzyme elevations
  outcome:
    text: The two phase 3 EVOLUTION trials in relapsing MS did not show a lower annualised relapse rate
      than teriflunomide.
    url: https://www.mssociety.org.uk/research/latest-research/latest-research-news-and-blogs/phase-3-trials-show-evobrutinib-no-better-existing-treatments-people-relapsing-ms
    date: 2023-12-05
  signals: []
  recorded_by: Dasha (a retrospective case; the expectation is a range, not an expert's answer)
  recorded_at: 2026-10-10
