- id: tolebrutinib-2025-12
  set: backtest
  input:
    asset: tolebrutinib
  as_of: 2025-12-01
  expected_verdict:
  - Conditional
  - Do Not Invest
  expected_top_risks:
  - Drug-induced liver injury
  - The FDA review of non-relapsing secondary progressive MS was delayed again
  - The primary progressive trial (PERSEUS) had not read out
  outcome:
    text: PERSEUS in primary progressive MS did not meet its primary endpoint (2025-12-15) and the FDA
      issued a complete response letter for non-relapsing secondary progressive MS (December 2025).
    url: https://www.sanofi.com/assets/dotcom/pressreleases/2025/2025-12-15-06-05-00-3205094-en.pdf
    date: 2025-12-15
  probes:
  - kind: strong
    direction: lower
    as_of: 2025-12-16
    note: the sponsor reports a phase 3 failure
    evidence:
      text: 'Results from the PERSEUS phase 3 study (clinical study identifier: NCT04458051) showed that
        tolebrutinib did not meet its primary endpoint in delaying time to 6-month composite confirmed
        disability progression (cCDP) in participants with primary progressive multiple sclerosis (PPMS),
        which represents 10% of the overall multiple sclerosis patient population. Based on these results,
        Sanofi will not pursue regulatory registration for PPMS.'
      url: https://www.sanofi.com/assets/dotcom/pressreleases/2025/2025-12-15-06-05-00-3205094-en.pdf
      source: Sanofi press release
      source_kind: company
      level: human_interventional
      published_at: 2025-12-15
  - kind: weak
    direction: lower
    as_of: 2025-12-16
    note: the sponsor announces an impairment test of the asset
    evidence:
      text: Sanofi will conduct an impairment test in accordance with IFRS (IAS 36) on the intangible
        asset value attached to tolebrutinib with a status to be provided with Q4 and FY 2025 results
        in January 2026. The outcome of this test will have no impact to the business net income / business
        EPS and there is no change to the financial guidance for 2025.
      url: https://www.sanofi.com/assets/dotcom/pressreleases/2025/2025-12-15-06-05-00-3205094-en.pdf#impairment
      source: Sanofi press release
      source_kind: company
      level: human_observational
      published_at: 2025-12-15
  - kind: noise
    as_of: 2026-07-03
    note: a result for another drug in another disease
    evidence:
      text: The study met its primary and key secondary endpoint, with divarasib achieving clinically
        meaningful and statistically significant improvements in both progression-free survival (PFS)
        and overall survival (OS).
      url: https://www.roche.com/media/releases/med-cor-2026-07-02
      source: Roche press release
      source_kind: company
      level: human_interventional
      published_at: 2026-07-02
  signals: []
  recorded_by: Dasha (a retrospective case with sensitivity probes; not an expert's answer)
  recorded_at: 2026-10-10
