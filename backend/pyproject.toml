[project]
name = "bioverdict"
version = "0.1.0"
description = "Evidence-first AI investment committee for biotech underwriting"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13",
  "httpx>=0.28",
  "tenacity>=9.1",
  "numpy>=2.5",
  "langgraph>=1.2",
  "anthropic>=1.11",
  "openai>=3.24",
  "google-genai>=2.28",
]

[project.scripts]
bioverdict = "bioverdict:main"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff>=0.16"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
