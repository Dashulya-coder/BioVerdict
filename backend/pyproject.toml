[project]
name = "bioverdict"
version = "0.1.0"
description = "Evidence-first AI investment committee for biotech underwriting"
readme = "README.md"
authors = [
  { name = "lisovskyi-arsenii", email = "lisovskyiarsenii@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13.5",
  "httpx>=0.28.1",
  "tenacity>=9.1",
  "numpy>=2.5",
  "langgraph>=1.2.13",
  "anthropic>=1.11",
  "openai>=3.24",
  "google-genai>=2.28",
  "pyyaml>=6.0.3",
]

[project.scripts]
bioverdict = "bioverdict:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4", "ruff>=0.16.10"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
